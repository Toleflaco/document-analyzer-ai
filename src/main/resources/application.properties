# Application
spring.application.name=document-analyzer-ai

# Spring AI - Anthropic Claude
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-4-5
spring.ai.anthropic.chat.temperature=0.3
spring.ai.anthropic.chat.max-tokens=4096

# Logging (útil para ver qué está haciendo Spring AI)
logging.level.org.springframework.ai=INFO

# Actuator endpoints (por defecto solo /health está expuesto)
# Si necesitas más para diagnóstico, añade aquí y comenta al terminar



spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# LLM pricing (USD per million tokens). Anthropic Claude Sonnet 4.5 as of 2026-07.
llm.pricing.input-per-mtok=3.00
llm.pricing.output-per-mtok=15.00


spring.data.redis.host=localhost
spring.data.redis.port=6379
